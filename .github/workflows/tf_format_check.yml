name: TERRAFORM CI
run-name: ${{github.actor}} is running TERRAFORM CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
env:
  TF_VERSION: 1.15.6
permissions:
  contents: read
jobs:
  check-tf-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          fetch-depth: 1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: make tf.fmt.ci

  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          fetch-depth: 1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: make tf.init
      - run: terraform -chdir=infra/envs/dev validate

  checkov-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          fetch-depth: 1
      - run: make tf.scan
